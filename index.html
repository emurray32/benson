<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benson — Pet of the Month, The Gunther</title>
<meta name="description" content="Officially the best dog at The Gunther. Documented evidence below.">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fbf6ec;
    --accent: #c97a2b;
    --accent-dark: #7d4515;
    --caption-bg: rgba(255, 252, 245, 0.96);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  header {
    text-align: center;
    padding: 48px 24px 24px;
    position: relative;
  }
  .crown {
    font-size: 56px;
    line-height: 1;
    display: inline-block;
    transform: rotate(-6deg);
  }
  h1 {
    font-family: Georgia, "Playfair Display", serif;
    font-weight: 900;
    font-size: clamp(40px, 8vw, 80px);
    margin: 8px 0 4px;
    letter-spacing: -0.02em;
    color: var(--accent-dark);
  }
  .sub {
    font-size: clamp(15px, 2vw, 19px);
    color: #6a4a2a;
    margin: 0 auto;
    max-width: 620px;
    padding: 0 16px;
  }
  .sub em { color: var(--accent); font-style: normal; font-weight: 700; }
  .ribbon {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 6px 22px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 13px;
    border-radius: 4px;
    margin-top: 14px;
    box-shadow: 0 2px 0 var(--accent-dark);
  }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  .gallery {
    columns: 3 280px;
    column-gap: 18px;
  }
  .card {
    break-inside: avoid;
    margin-bottom: 18px;
    border-radius: 14px;
    overflow: hidden;
    background: white;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.04),
      0 6px 20px rgba(60, 30, 0, 0.10);
    transform: rotate(var(--tilt, 0deg));
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover {
    transform: rotate(0deg) scale(1.02);
    box-shadow: 0 10px 28px rgba(60, 30, 0, 0.20);
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    background: #eee;
  }
  .caption {
    padding: 12px 16px 14px;
    font-size: 15px;
    font-weight: 600;
    color: #2a1a05;
    background: var(--caption-bg);
    border-top: 2px dashed rgba(201, 122, 43, 0.4);
  }
  .caption .small { display:block; font-size: 12px; font-weight: 500; color: #8a6240; margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  footer {
    text-align: center;
    padding: 40px 20px 64px;
    color: #8a6240;
    font-size: 14px;
  }
  footer .stamp {
    display: inline-block;
    border: 2px solid var(--accent);
    color: var(--accent-dark);
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transform: rotate(-3deg);
    margin-bottom: 12px;
  }
  .card:nth-child(3n+1) { --tilt: -1.2deg; }
  .card:nth-child(3n+2) { --tilt:  0.8deg; }
  .card:nth-child(3n+3) { --tilt: -0.4deg; }

  /* Audio banner — sits between gallery and footer stamp */
  .audio-banner {
    max-width: 720px;
    margin: 8px auto 0;
    padding: 28px 28px 24px;
    background: radial-gradient(circle at 30% 30%, #e8c98a 0%, #c97a2b 65%, #7d4515 100%);
    color: #fffaf0;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 6px 22px rgba(60, 30, 0, 0.18);
  }
  .audio-banner .emoji { font-size: 44px; line-height: 1; }
  .audio-banner h3 {
    margin: 8px 0 4px;
    font-family: Georgia, "Playfair Display", serif;
    font-weight: 900;
    font-size: 32px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .audio-banner p {
    margin: 0 0 16px;
    font-size: 12px;
    opacity: 0.92;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .audio-banner audio {
    width: 100%;
    max-width: 480px;
    display: block;
    margin: 0 auto;
  }
</style>
</head>
